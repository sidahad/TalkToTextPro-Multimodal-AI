<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TechWiz TalkToText Pro</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <style>
    .upload-barrrr {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .upload-barrrr>div {
      flex: 1;
    }

    .upload-btn {
      display: block;
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.3s;
      height: 40px;
    }

    #speak-btn {
      background: linear-gradient(135deg, #ff6b6b, #ee5a52) !important;
      color: white !important;
      border: none !important;
      padding: 12px !important;
      margin: 10px 0 !important;
      border-radius: 8px !important;
      width: 100% !important;
      font-size: 16px !important;
      font-weight: bold !important;
      cursor: pointer !important;
      display: none !important;
    }

    #speak-btn:hover {
      background: linear-gradient(135deg, #ee5a52, #ff6b6b) !important;
      transform: scale(1.02) !important;
    }

    #speak-btn:disabled {
      opacity: 0.7 !important;
      cursor: not-allowed !important;
    }

    @media (min-width: 768px) {
      .upload-barrrr {
        flex-wrap: nowrap;
      }

      .upload-barrrr>div {
        flex: unset;
        width: auto;
      }

      .upload-btn {
        width: auto;
        min-width: 100px;
      }
    }

    @media (max-width: 768px) {
      .infom {
        display: flex;
      }
      
      .left-sidebar {
        position: fixed;
        top: 0;
        left: -100%;
        width: 80%;
        height: 100%;
        z-index: 1000;
        transition: left 0.3s ease;
        background: var(--sidebar-bg);
        box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        overflow-y: auto;
      }
      
      .left-sidebar.active {
        left: 0;
      }
      
      .sidebar-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 999;
        display: none;
      }
      
      .sidebar-overlay.active {
        display: block;
      }
      
      .sidebar-close {
        display: block !important;
        position: absolute;
        top: 5px;
        right: 6px;
        background: var(--button-bg);
        color: white;
        border: none;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 1001;
        padding: 0px;
      }
      
      .sidebar-toggle {
        display: block !important;
        position: fixed;
        top: 5px;
        left: 15px;
        background: var(--button-bg);
        color: white;
        border: none;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 998;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      }
      
      .header {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 10px 0;
        gap: 0px;
      }
      
      .header h1 {
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
      }
      
      .header .upload-barrrr {
        justify-content: center;
        margin-top: 10px;
        width: 100%;
      }
    }

    @media (min-width: 768px) {
      .infom {
        flex-direction: row;
        padding: 10px;
      }
      
      .sidebar-close, .sidebar-toggle {
        display: none !important;
      }
      
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
      }
      
      .header h1 {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 10px;
      }
    }
    
    #extracted-box, #transcript-box, #summary-box {
      background: var(--input-bg);
      padding: 15px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      max-height: 315px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.5;
    }
    
   .logo-wrapper {
      position: relative;
    }
  </style>
</head>

<body data-theme="dark">
  <button class="sidebar-toggle" style="padding: 0px;" id="sidebar-toggle">
    <i class="fa-solid fa-bars"></i>
  </button>
  
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  
  <div class="left-sidebar" id="left-sidebar">
    <button class="sidebar-close" id="sidebar-close">
      <i class="fa-solid fa-times"></i>
    </button>
    
    <div class="logo-wrapper">
      <img src="{{ url_for('static', filename='landing_assets/images/talktotextlogo.png') }}" alt="Logo"
        class="logo-img">
      <span class="logo-text" style="color: #007bff;">TalkToText Pro</span>
    </div>
    <div class="search-wrapper">
      <span class="icon"><i class="fa-solid fa-magnifying-glass"></i></span>
      <input id="search" placeholder="Search history..." />
    </div>
    <h3><i class="fa-solid fa-thumbtack"></i> Pinned</h3>
    <div id="pinned-history" class="chat-history"></div>
    <h3><i class="fa-solid fa-comments"></i> Chats</h3>
    <div id="chat-history" class="chat-history"></div>

    <button class="clear-history" id="clear-all">Clear All</button>
  </div>

  <div class="main">
    <div class="header">
      <h1> 
        <img src="{{ url_for('static', filename='landing_assets/images/talktotextlogo.png') }}"
          style="height: 30px; width: 30px;" alt="Logo"> 
        TechWiz TalkToText Pro
      </h1>
      <div class="upload-barrrr" style="flex-wrap: nowrap;">
        <div>
          <button class="new-chat" id="new-chat" style="height: 40px;">New Chat</button>
        </div>
        <div class="theme-selector ">
          <button class="theme-button" style="height: 40px;">
            <i class="fa-solid fa-palette"></i> Theme
          </button>
          <div class="theme-options">
            <div class="theme-option" data-theme="dark">
              <span class="theme-color" style="background: linear-gradient(135deg, #6b48ff, #2200ff);"></span>
              <span>Dark</span>
            </div>
            <div class="theme-option" data-theme="light">
              <span class="theme-color" style="background: linear-gradient(135deg, #007bff, #ffffff);"></span>
              <span>Light</span>
            </div>
            <div class="theme-option" data-theme="nature">
              <span class="theme-color" style="background: linear-gradient(135deg, #4caf50, #8bc34a);"></span>
              <span>Nature</span>
            </div>
            <div class="theme-option" data-theme="sunset">
              <span class="theme-color" style="background: linear-gradient(135deg, #2a0545, #5d0092);"></span>
              <span>Purple</span>
            </div>
            <div class="theme-option" data-theme="ocean">
              <span class="theme-color" style="background: linear-gradient(135deg, #29b6f6, #4fc3f7);"></span>
              <span>Ocean</span>
            </div>
          </div>
        </div>

        <div>
          <a href="/history"><i class="fa-solid fa-history"></i> History</a>
        </div>
        <div><a href="/logout"><i class="fa-solid fa-sign-out"></i> Logout</a></div>
      </div>
    </div>
    <div class="chat-search-wrapper">
      <input id="chat-search" placeholder="Search in this chat..." />
    </div>
    <div class="chat-container" id="chat-container"></div>
    <button id="speak-btn">
      <i class="fa-solid fa-volume-high"></i> اردو میں بولو!
    </button>
    <audio id="urdu-audio" preload="none" style="display:none;"></audio>
    <form id="chat-form" class="infom" enctype="multipart/form-data" style="display: flex;">

      <input type="text" id="query" placeholder="Type your message..." />
      <button type="button" id="mic-button"><i class="fa-solid fa-microphone"></i></button>
<select id="model-select" style="margin-left: 10px; padding: 5px; border-radius: 4px;">
  <option value="gemini">Gemini</option>
  <option value="groq">Groq (Super Fast)</option>
  <option value="cloudflare">Cloudflare (Free Images)</option>
</select>
      <button type="submit">Send</button>
      <div class="image-preview" id="image-preview"></div>
    </form>
    <div class="upload-bar">
      <div class="upload-barrrr">
        <div>
          <input type="file" id="image" accept="image/*" style="display:none;" />
          <label for="image" class="upload-btn"><i class="fa-solid fa-image"></i> Image</label>
        </div>

        <div>
          <input type="file" id="file" accept="application/pdf" style="display:none;" />
          <label for="file" class="upload-btn"><i class="fa-solid fa-file-pdf"></i> PDF</label>
        </div>
      </div>

      <form id="audio-form" enctype="multipart/form-data" style="border: 0px;">
        <input type="file" id="audio" accept="audio/*" style="display:none;" />
        <label for="audio" class="upload-btn"><i class="fa-solid fa-microphone"></i> Audio</label>
        <select id="lang">
          <option value="en">English</option>
          <option value="ur">Urdu</option>
          <option value="fr">French</option>
          <option value="de">German</option>
        </select>
        <button class="upload-btn" type="submit">Process</button>
      </form>
      <button class="upload-btn"><i class="fa-solid fa-file-lines"></i> Notes</button>
    </div>
  </div>
  

  <button id="right-toggle" style="display: none;"><i class="fa-solid fa-bars"></i></button>
  <div class="right-sidebar">
    <button class="close-sidebar"><i class="fa-solid fa-times"></i> Close</button>
    <h3><i class="fa-solid fa-cog"></i> Processing Panel</h3>
    <div class="pdf-section">
      <h4><i class="fa-solid fa-file-pdf"></i> Extracted PDF Text</h4>
      <div id="extracted-box" style="margin-bottom: 5px;"></div>
      <button id="copy-btn" style="display:none;">Copy</button>
      <button id="summarize-btn" style="display:none;">Summarize</button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='chat.js') }}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const themeButton = document.querySelector('.theme-button');
      const themeOptions = document.querySelector('.theme-options');
      const themeOptionsItems = document.querySelectorAll('.theme-option');

      themeButton.addEventListener('click', function () {
        themeOptions.classList.toggle('active');
      });

      document.addEventListener('click', function (event) {
        if (!event.target.closest('.theme-selector')) {
          themeOptions.classList.remove('active');
        }
      });

      themeOptionsItems.forEach(option => {
        option.addEventListener('click', function () {
          const theme = this.getAttribute('data-theme');
          document.body.setAttribute('data-theme', theme);
          themeOptions.classList.remove('active');

          localStorage.setItem('selectedTheme', theme);
        });
      });

      const savedTheme = localStorage.getItem('selectedTheme');
      if (savedTheme) {
        document.body.setAttribute('data-theme', savedTheme);
      }
      
      // Mobile sidebar functionality
      const sidebarToggle = document.getElementById('sidebar-toggle');
      const sidebarClose = document.getElementById('sidebar-close');
      const sidebarOverlay = document.getElementById('sidebar-overlay');
      const leftSidebar = document.getElementById('left-sidebar');
      
      function openSidebar() {
        leftSidebar.classList.add('active');
        sidebarOverlay.classList.add('active');
        document.body.style.overflow = 'hidden';
      }
      
      function closeSidebar() {
        leftSidebar.classList.remove('active');
        sidebarOverlay.classList.remove('active');
        document.body.style.overflow = '';
      }
      
      sidebarToggle.addEventListener('click', openSidebar);
      sidebarClose.addEventListener('click', closeSidebar);
      sidebarOverlay.addEventListener('click', closeSidebar);
      
      // Close sidebar when a link is clicked (for navigation)
      const sidebarLinks = leftSidebar.querySelectorAll('a, button');
      sidebarLinks.forEach(link => {
        link.addEventListener('click', closeSidebar);
      });
    });
  </script>

</body>
</html>
