<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - TechWiz TalkToText Pro</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  .form-group {
    display: inline;
    flex-direction: row;
    gap: 8px;
}
</style>
</head>
<body data-theme="dark">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <img src="{{ url_for('static', filename='landing_assets/images/talktotextlogo.png') }}" alt="Logo" class="logo-img">
          <span class="logo-text">TalkToText Pro</span>
        </div>
        <h2 class="auth-title">Welcome Back</h2>
        <p class="auth-subtitle">Sign in to your account to continue</p>
      </div>
      
      <form class="auth-form" method="POST">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter your username" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
        
        <button type="submit">Sign In</button>
      </form>
      
      <div class="auth-footer">
        <p>Don't have an account? <a href="{{ url_for('register') }}" class="auth-link">Sign up now</a></p>
      </div>

     
    </div>
  </div>

  <script>
    // Theme Selection Functionality
    document.addEventListener('DOMContentLoaded', function() {
      const themeButton = document.querySelector('.theme-button');
      const themeOptions = document.querySelector('.theme-options');
      const themeOptionsItems = document.querySelectorAll('.theme-option');
      
      // Toggle theme options dropdown
      themeButton.addEventListener('click', function() {
        themeOptions.classList.toggle('active');
      });
      
      // Close dropdown when clicking outside
      document.addEventListener('click', function(event) {
        if (!event.target.closest('.theme-selector')) {
          themeOptions.classList.remove('active');
        }
      });
      
      // Change theme when an option is selected
      themeOptionsItems.forEach(option => {
        option.addEventListener('click', function() {
          const theme = this.getAttribute('data-theme');
          document.body.setAttribute('data-theme', theme);
          themeOptions.classList.remove('active');
          
          // Save theme preference to localStorage
          localStorage.setItem('selectedTheme', theme);
        });
      });
      
      // Load saved theme from localStorage
      const savedTheme = localStorage.getItem('selectedTheme');
      if (savedTheme) {
        document.body.setAttribute('data-theme', savedTheme);
      }
    });
  </script>
</body>
</html>
