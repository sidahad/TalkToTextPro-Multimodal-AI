<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - TechWiz TalkToText Pro</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  form {
    display: flex;
    padding: 15px 20px;
    background: var(--bg-color);
    border-top: 1px solid var(--border-color);
    gap: 10px;
    justify-content: center;
    align-items: normal;
    z-index: 7;
    box-shadow: var(--shadow);
}
</style>
</head>
<body data-theme="dark">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header" style="padding-top: 6px;">
        <div class="auth-logo">
          <img src="{{ url_for('static', filename='landing_assets/images/talktotextlogo.png') }}" alt="Logo" class="logo-img">
          <span class="logo-text">TalkToText Pro</span>
        </div>
        <p class="auth-subtitle">Sign up to get started with TalkToText Pro</p>
      </div>
      
      <form class="auth-form" method="POST">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Choose a username" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Create a password" required>
        </div>
        
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>
        </div>
        
        <button type="submit">Create Account</button>
      </form>
      
      <div class="auth-footer">
        <p>Already have an account? <a href="{{ url_for('login') }}" class="auth-link">Sign in here</a></p>
      </div>

    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const themeButton = document.querySelector('.theme-button');
      const themeOptions = document.querySelector('.theme-options');
      const themeOptionsItems = document.querySelectorAll('.theme-option');
      
      themeButton.addEventListener('click', function() {
        themeOptions.classList.toggle('active');
      });
      document.addEventListener('click', function(event) {
        if (!event.target.closest('.theme-selector')) {
          themeOptions.classList.remove('active');
        }
      });
      themeOptionsItems.forEach(option => {
        option.addEventListener('click', function() {
          const theme = this.getAttribute('data-theme');
          document.body.setAttribute('data-theme', theme);
          themeOptions.classList.remove('active');
          
          localStorage.setItem('selectedTheme', theme);
        });
      });
      
      const savedTheme = localStorage.getItem('selectedTheme');
      if (savedTheme) {
        document.body.setAttribute('data-theme', savedTheme);
      }

      const password = document.getElementById('password');
      const confirmPassword = document.getElementById('confirm-password');
      
      function validatePassword() {
        if (password.value !== confirmPassword.value) {
          confirmPassword.setCustomValidity("Passwords don't match");
        } else {
          confirmPassword.setCustomValidity('');
        }
      }
      
      password.onchange = validatePassword;
      confirmPassword.onkeyup = validatePassword;
    });
  </script>
</body>
</html>
